name: CI

on:
  push:
  pull_request:

jobs:
  python-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile coverage helper
        run: python -m py_compile scripts/coverage_feedback.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Exercise coverage feedback CLI
        shell: bash
        run: |
          mkdir -p build
          cat > build/coverage.json <<'JSON'
          {
            "bins": {
              "read": 10,
              "write": 12,
              "aw_before_w": 5,
              "w_before_aw": 1,
              "link_backpressure": 0,
              "read_backpressure": 0,
              "write_resp_error": 0,
              "read_resp_error": 0
            }
          }
          JSON
          python scripts/coverage_feedback.py             --input build/coverage.json             --output build/next_bias.json             --plusargs build/next_bias.args
          cat build/next_bias.json
          cat build/next_bias.args
