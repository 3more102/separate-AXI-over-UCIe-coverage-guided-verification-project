[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "axi-ucie-cgverif"
version = "0.1.0"
description = "Coverage-guided verification scaffolding for AXI over an abstract UCIe/FDI transport"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
